<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rencana Makan 7 Hari — LetMeCook</title>
  <meta name="description" content="Susun 21 slot makan untuk seminggu. Daftar belanjanya tersusun sendiri dari resep yang kamu pilih.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B2%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a class="skip" href="#main">Lewati ke konten</a>

  <header class="topbar">
    <div class="topbar-in">
      <a class="logo" href="index.html"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-chef-hat"/></svg>LetMeCook</a>
      <nav class="iconnav" aria-label="Navigasi utama">
        <a href="favorit.html"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-heart"/></svg>Favorit <span class="badge" id="favCount">0</span></a>
        <a href="mealplan.html"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-calendar"/></svg>Rencana</a>
      </nav>
    </div>
  </header>

  <main class="wrap" id="main">

    <section class="panel" aria-labelledby="judul-rencana">
      <div class="panel-head">
        <h1 id="judul-rencana"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-calendar"/></svg>Rencana 7 hari</h1>
        <a href="#" id="cetakLink">Cetak <svg class="icon" aria-hidden="true"><use href="icons.svg#i-printer"/></svg></a>
      </div>
      <div class="hasil-bar">
        <span id="isiTeks">0 dari 21 slot terisi</span>
      </div>
      <div class="meal-grid" id="mealGrid"></div>
    </section>

    <section class="panel" aria-labelledby="judul-belanja">
      <div class="panel-head">
        <h2 id="judul-belanja"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-basket"/></svg>Daftar belanja</h2>
      </div>
      <div class="hasil-bar">
        <span id="belanjaTeks">Belum ada bahan</span>
      </div>
      <ul class="grocery" id="grocery"></ul>
      <form class="sederhana form-tambah" id="manualForm">
        <div>
          <label for="mNama">Tambahkan bahan sendiri</label>
          <input id="mNama" placeholder="misal: kecap manis" aria-label="Nama bahan">
        </div>
        <div class="baris-dua">
          <div>
            <label for="mJumlah">Jumlah</label>
            <input id="mJumlah" placeholder="250" inputmode="decimal" aria-label="Jumlah">
          </div>
          <div>
            <label for="mSatuan">Satuan</label>
            <input id="mSatuan" placeholder="gram" aria-label="Satuan">
          </div>
        </div>
        <button class="btn btn-solid" type="submit"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-plus"/></svg>Tambah ke daftar</button>
      </form>
    </section>
  </main>

  <!-- Pemilih resep. Lebih enak dipakai daripada mengetik nomor. -->
  <div class="cook" id="pilih" role="dialog" aria-modal="true" aria-label="Pilih resep">
    <div class="bar">
      <span id="pilihJudul">Pilih resep</span>
      <button class="tutup" id="pilihTutup" type="button"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-x"/></svg>Tutup</button>
    </div>
    <div class="langkah-besar pilih-isi">
      <label for="pilihCari" class="kicker kicker-terang">Cari resep</label>
      <input id="pilihCari" type="search" placeholder="Ketik nama, misal: soto"
             aria-label="Cari resep untuk diisi" class="pilih-cari">
      <ul class="pilih-daftar" id="pilihDaftar"></ul>
    </div>
  </div>

  <footer>
    <div class="wrap">
      <span><strong>LetMeCook</strong> — 44 panduan masak.</span>
      <span><a href="index.html"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-arrow-left"/></svg>Beranda</a></span>
    </div>
  </footer>

  <script src="store.js"></script>
  <script>
    segarkanBadge();

    const HARI = ["Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu", "Minggu"];
    const SLOT = [["pagi", "Pagi"], ["siang", "Siang"], ["malam", "Malam"]];

    function ambilRencana() {
      const isi = baca(KEY.meal, {});
      return isi && typeof isi === "object" ? isi : {};
    }

    function simpanRencana(rencana) {
      tulis(KEY.meal, rencana);
      gambarRencana();
      gambarBelanja();
    }

    // ---- Rencana 7 hari ----
    function gambarRencana() {
      const rencana = ambilRencana();
      const grid = document.getElementById("mealGrid");
      grid.innerHTML = "";

      let terisi = 0;

      HARI.forEach((hari) => {
        const kotak = document.createElement("div");
        kotak.className = "meal-hari";

        const judul = document.createElement("h3");
        judul.innerHTML = '<svg class="icon" aria-hidden="true"><use href="icons.svg#i-calendar"/></svg>' + hari;
        kotak.appendChild(judul);

        SLOT.forEach(([kode, label]) => {
          const idResep = rencana[hari] && rencana[hari][kode];
          const resep = idResep ? cariResep(idResep) : null;
          if (resep) terisi++;

          const baris = document.createElement("div");
          baris.className = "meal-slot";

          const waktu = document.createElement("span");
          waktu.className = "waktu";
          waktu.textContent = label;

          const isi = document.createElement("span");
          isi.className = "isi" + (resep ? "" : " kosong-teks");
          if (resep) {
            const tautan = document.createElement("a");
            tautan.href = "resep.html?id=" + encodeURIComponent(resep.id);
            tautan.textContent = resep.nama;
            tautan.style.color = "inherit";
            tautan.style.fontWeight = "600";
            isi.appendChild(tautan);
          } else {
            isi.textContent = "belum diisi";
          }

          const tombolPilih = document.createElement("button");
          tombolPilih.type = "button";
          tombolPilih.textContent = resep ? "Ganti" : "Isi";
          tombolPilih.addEventListener("click", () => bukaPemilih(hari, kode, label));

          baris.append(waktu, isi, tombolPilih);

          // Tombol hapus hanya berguna kalau slotnya sudah terisi.
          if (resep) {
            const tombolHapus = document.createElement("button");
            tombolHapus.type = "button";
            tombolHapus.innerHTML = '<svg class="icon" aria-hidden="true"><use href="icons.svg#i-x"/></svg>';
            tombolHapus.setAttribute("aria-label", "Kosongkan " + hari + " " + label);
            tombolHapus.addEventListener("click", () => {
              const baru = ambilRencana();
              if (baru[hari]) delete baru[hari][kode];
              simpanRencana(baru);
            });
            baris.appendChild(tombolHapus);
          }

          kotak.appendChild(baris);
        });

        grid.appendChild(kotak);
      });

      document.getElementById("isiTeks").textContent = terisi + " dari 21 slot terisi";
    }

    // ---- Pemilih resep ----
    const pilih = document.getElementById("pilih");
    const pilihDaftar = document.getElementById("pilihDaftar");
    const pilihCari = document.getElementById("pilihCari");
    let slotSasaran = null;

    function gambarPilihan() {
      const kata = pilihCari.value.trim().toLowerCase();
      const daftar = RESEP.filter((r) => {
        if (!kata) return true;
        return (r.nama + " " + r.daerah + " " + r.kategori).toLowerCase().includes(kata);
      }).slice(0, 30);

      pilihDaftar.innerHTML = daftar.map((r) =>
        '<li><button type="button" data-id="' + esc(r.id) + '">'
        + '<span class="pilih-nama">' + esc(r.nama) + "</span>"
        + '<span class="pilih-ket">' + esc(r.daerah) + " · " + fmtWaktu(r.waktuTotal) + " · " + esc(r.level) + "</span>"
        + "</button></li>"
      ).join("");

      pilihDaftar.querySelectorAll("button[data-id]").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (!slotSasaran) return;
          const baru = ambilRencana();
          if (!baru[slotSasaran.hari]) baru[slotSasaran.hari] = {};
          baru[slotSasaran.hari][slotSasaran.kode] = btn.dataset.id;
          tutupPemilih();
          simpanRencana(baru);
        });
      });
    }

    function bukaPemilih(hari, kode, label) {
      slotSasaran = { hari: hari, kode: kode };
      document.getElementById("pilihJudul").textContent = "Pilih resep untuk " + hari + " " + label;
      pilihCari.value = "";
      gambarPilihan();
      pilih.classList.add("buka");
      pilihCari.focus();
    }

    function tutupPemilih() {
      pilih.classList.remove("buka");
      slotSasaran = null;
    }

    document.getElementById("pilihTutup").addEventListener("click", tutupPemilih);
    pilihCari.addEventListener("input", gambarPilihan);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && pilih.classList.contains("buka")) tutupPemilih();
    });

    // ---- Daftar belanja ----
    // Bahan dengan nama dan satuan sama digabung jumlahnya.
    function susunBelanja() {
      const rencana = ambilRencana();
      const gabung = {};

      HARI.forEach((hari) => {
        SLOT.forEach(([kode]) => {
          const idResep = rencana[hari] && rencana[hari][kode];
          const resep = idResep ? cariResep(idResep) : null;
          if (!resep) return;

          resep.bahan.forEach((b) => {
            const kunci = b.nama.toLowerCase().trim() + "|" + b.satuan.toLowerCase().trim();
            if (!gabung[kunci]) {
              gabung[kunci] = { nama: b.nama, satuan: b.satuan, jumlah: 0, dari: [] };
            }
            gabung[kunci].jumlah += b.jumlah;
            if (!gabung[kunci].dari.includes(resep.nama)) gabung[kunci].dari.push(resep.nama);
          });
        });
      });

      return Object.values(gabung).sort((a, b) => a.nama.localeCompare(b.nama, "id"));
    }

    // Bahan yang kamu tulis sendiri. Disimpan di localStorage supaya tidak
    // hilang saat daftar digambar ulang (misalnya setelah mengisi slot).
    function ambilTambahan() {
      const isi = baca(KEY.gmanual, []);
      return Array.isArray(isi) ? isi : [];
    }

    function simpanTambahan(daftar) {
      tulis(KEY.gmanual, daftar);
    }

    // Satu baris bahan di daftar belanja.
    function barisBahan(teks, kunci, keterangan) {
      const centang = baca(KEY.gcheck, {});
      const li = document.createElement("li");
      if (centang[kunci]) li.classList.add("centang");

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = Boolean(centang[kunci]);
      cb.setAttribute("aria-label", teks);
      cb.addEventListener("change", () => {
        const baru = baca(KEY.gcheck, {});
        baru[kunci] = cb.checked;
        tulis(KEY.gcheck, baru);
        li.classList.toggle("centang", cb.checked);
      });

      const sp = document.createElement("span");
      sp.textContent = teks;
      if (keterangan) {
        const ket = document.createElement("span");
        ket.className = "dari";
        ket.textContent = keterangan;
        sp.appendChild(ket);
      }

      li.append(cb, sp);
      return li;
    }

    function gambarBelanja() {
      const ul = document.getElementById("grocery");
      const dariResep = susunBelanja();
      const tambahan = ambilTambahan();
      ul.innerHTML = "";

      const total = dariResep.length + tambahan.length;
      document.getElementById("belanjaTeks").textContent = total
        ? total + " bahan"
        : "Belum ada bahan";

      if (!total) {
        const li = document.createElement("li");
        const sp = document.createElement("span");
        sp.textContent = "Isi minimal satu slot di atas, atau tambahkan bahan sendiri di bawah.";
        li.appendChild(sp);
        ul.appendChild(li);
        return;
      }

      // Bahan dari resep rencana makan.
      dariResep.forEach((g) => {
        const jumlah = fmtQty(Math.round(g.jumlah * 4) / 4);
        ul.appendChild(barisBahan(
          jumlah + " " + g.satuan + " " + g.nama,
          g.nama + "|" + g.satuan,
          "untuk " + g.dari.join(", ")
        ));
      });

      // Bahan yang ditulis sendiri.
      tambahan.forEach((t, i) => {
        const li = barisBahan(t.teks, "manual|" + i, null);

        const hapus = document.createElement("button");
        hapus.type = "button";
        hapus.innerHTML = '<svg class="icon" aria-hidden="true"><use href="icons.svg#i-x"/></svg>';
        hapus.setAttribute("aria-label", "Hapus " + t.teks);
        hapus.addEventListener("click", () => {
          const baru = ambilTambahan();
          baru.splice(i, 1);
          simpanTambahan(baru);
          gambarBelanja();
        });
        li.appendChild(hapus);

        ul.appendChild(li);
      });
    }

    // ---- Tambah bahan manual ----
    document.getElementById("manualForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const nama = document.getElementById("mNama").value.trim();
      if (!nama) return;

      const jumlah = document.getElementById("mJumlah").value.trim();
      const satuan = document.getElementById("mSatuan").value.trim();
      const teks = [jumlah, satuan, nama].filter(Boolean).join(" ");

      const daftar = ambilTambahan();
      daftar.push({ teks, nama });
      simpanTambahan(daftar);

      e.target.reset();
      gambarBelanja();
    });

    document.getElementById("cetakLink").addEventListener("click", (e) => {
      e.preventDefault();
      window.print();
    });

    gambarRencana();
    gambarBelanja();
  </script>
</body>
</html>
