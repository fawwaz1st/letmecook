<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorit — LetMeCook</title>
  <meta name="description" content="Resep yang kamu simpan di LetMeCook. Tersimpan di browser, tanpa akun.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B2%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://i.ytimg.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a class="skip" href="#main">Lewati ke konten</a>

  <header class="topbar">
    <div class="topbar-in">
      <a class="logo" href="index.html"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-chef-hat"/></svg>LetMeCook</a>
      <nav class="iconnav" aria-label="Navigasi utama">
        <a href="favorit.html"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-heart"/></svg>Favorit <span class="badge" id="favCount">0</span></a>
        <a href="mealplan.html"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-calendar"/></svg>Rencana</a>
      </nav>
    </div>
  </header>

  <main class="wrap" id="main">
    <section class="panel" aria-labelledby="judul">
      <div class="panel-head">
        <h1 id="judul"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-heart"/></svg>Resep yang kamu simpan</h1>
      </div>

      <div class="hasil-bar">
        <span id="jumlahTeks">Belum ada resep tersimpan</span>
      </div>

      <div class="pad-grid"><div class="grid" id="grid"></div></div>

      <div class="kosong" id="kosong" hidden>
        <svg class="icon" aria-hidden="true"><use href="icons.svg#i-heart"/></svg>
        <strong>Daftarnya masih kosong</strong>
        <p>Buka katalog, tekan Simpan di resep yang mau kamu masak nanti. Daftarnya muncul di sini dan tersimpan di browser.</p>
        <a class="btn btn-solid" href="katalog.html">Buka katalog</a>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <span><strong>LetMeCook</strong> — 44 panduan masak.</span>
      <span><a href="index.html"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-arrow-left"/></svg>Beranda</a></span>
    </div>
  </footer>

  <script src="store.js"></script>
  <script>
    segarkanBadge();

    function gambar() {
      const daftar = ambilFav().map(cariResep).filter(Boolean);
      segarkanBadge();

      document.getElementById("kosong").hidden = daftar.length > 0;
      document.getElementById("jumlahTeks").textContent =
        daftar.length ? daftar.length + " resep tersimpan di browser ini" : "Belum ada resep tersimpan";

      // Di halaman ini, melepas simpan berarti kartunya harus hilang.
      isiKartu(document.getElementById("grid"), daftar, { setelahSimpan: gambar });
    }

    gambar();
    siapkanHalaman();
  </script>
</body>
</html>
