<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://upload.wikimedia.org; style-src 'unsafe-inline'">
<title>Grid Foto Periksa</title>
<style>
  body { font: 13px system-ui; margin: 0; padding: 12px; background: #111; color: #eee; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  figure { margin: 0; background: #222; border-radius: 6px; overflow: hidden; }
  img { width: 100%; aspect-ratio: 3/2; object-fit: cover; display: block; background: #333; }
  figcaption { padding: 5px 7px; font-size: 12px; line-height: 1.3; }
</style></head>
<body><div class="grid">
  <figure>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/Ayam_pop.JPG/500px-Ayam_pop.JPG" alt="">
    <figcaption><b>ayam-pop</b><br>Ayam Pop</figcaption>
  </figure>
  <figure>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/fc/Nasi_Liwet_Solo.jpg/500px-Nasi_Liwet_Solo.jpg" alt="">
    <figcaption><b>nasi-liwet-solo</b><br>Nasi Liwet Solo</figcaption>
  </figure>
  <figure>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/Ikan_Tude_Bakar.JPG/500px-Ikan_Tude_Bakar.JPG" alt="">
    <figcaption><b>ikan-dabu-dabu</b><br>Ikan Bakar Dabu-Dabu</figcaption>
  </figure>
  <figure>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/67/Bali_cuisine.jpg/500px-Bali_cuisine.jpg" alt="">
    <figcaption><b>kohu-kohu</b><br>Kohu-Kohu</figcaption>
  </figure>
  <figure>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/78/Keumamah_Aceh.jpg/500px-Keumamah_Aceh.jpg" alt="">
    <figcaption><b>keumamah</b><br>Keumamah Ikan Kayu</figcaption>
  </figure>
  <figure>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/67/Bali_cuisine.jpg/500px-Bali_cuisine.jpg" alt="">
    <figcaption><b>serombotan</b><br>Serombotan Klungkung</figcaption>
  </figure>
  <figure>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Laksa_Betawi_1.jpg/500px-Laksa_Betawi_1.jpg" alt="">
    <figcaption><b>laksa-bogor</b><br>Laksa Bogor</figcaption>
  </figure>
  <figure>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ee/Sei_sapi_Kupang.jpg/500px-Sei_sapi_Kupang.jpg" alt="">
    <figcaption><b>sei-sapi</b><br>Se'i Sapi</figcaption>
  </figure></div></body></html>
